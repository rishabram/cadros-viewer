<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hack-A-House — Parcel Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@700;900&family=Saira:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--ink2:#222;--acc:#ea522a;--gray:#f3f3f3;--dark:#222;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Saira',sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.topbar{background:var(--dark);color:#fff}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:12px;padding-bottom:12px}
.brand{font-family:'Saira Extra Condensed',sans-serif;font-weight:900;font-size:22px;letter-spacing:.35em}
.brand em{font-style:normal;color:var(--acc)}
.topbar .who{font-size:13px;letter-spacing:.18em;color:#bbb}
.finder{background:var(--acc);border-bottom:6px solid var(--ink)}
.finder .wrap{padding-top:44px;padding-bottom:44px}
.finder h1{font-family:'Saira Extra Condensed',sans-serif;font-weight:900;font-size:76px;line-height:.95;color:#111;text-transform:uppercase}
.finder p.sub{font-size:18px;margin:10px 0 20px;color:#222;max-width:640px}
.searchbox{position:relative;max-width:720px}
#q{width:100%;font-family:'Saira',sans-serif;font-size:20px;padding:18px 20px;border:6px solid var(--ink);background:#fff;color:var(--ink);outline:none;border-radius:0}
#q:focus{box-shadow:8px 8px 0 var(--ink)}
#sugg{position:absolute;top:100%;left:0;right:0;background:#fff;border:6px solid var(--ink);border-top:0;display:none;z-index:50;max-height:340px;overflow:auto}
#sugg button{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:2px solid #eee;padding:12px 18px;font-family:'Saira',sans-serif;font-size:16px;cursor:pointer;color:var(--ink)}
#sugg button:hover{background:var(--gray)}
#sugg button .pid{display:block;font-size:12px;color:#777;letter-spacing:.06em}
#sugg button .noaddr{color:#999;font-style:italic}
.tryline{margin-top:16px;font-size:14px;color:#222}
.tryline button{background:#111;color:#fff;border:0;font-family:'Saira',sans-serif;font-weight:700;font-size:13px;padding:8px 14px;margin:4px 6px 0 0;cursor:pointer;letter-spacing:.04em}
.tryline button:hover{color:var(--acc)}
.report{padding:48px 0 8px}
.addr{font-family:'Saira Extra Condensed',sans-serif;font-weight:900;font-size:64px;line-height:1;text-transform:uppercase}
.addr-sub{margin-top:8px;font-size:15px;letter-spacing:.14em;color:#555;text-transform:uppercase}
.addr-sub b{color:var(--ink)}
.verdict{display:flex;margin:30px 0;border:6px solid var(--ink);background:#fff}
.vletter{flex:0 0 150px;display:flex;align-items:center;justify-content:center;font-family:'Saira Extra Condensed',sans-serif;font-weight:900;font-size:110px;color:#fff;border-right:6px solid var(--ink)}
.vbody{flex:1;padding:22px 28px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.vbody h2{font-family:'Saira Extra Condensed',sans-serif;font-weight:900;font-size:52px;line-height:1;text-transform:uppercase}
.vbody p{font-size:19px;margin-top:8px;color:var(--ink2);max-width:640px}
.vlot{flex:0 0 240px;border-left:6px solid var(--ink);background:var(--gray);display:flex;align-items:center;justify-content:center;padding:10px}
.vA .vletter{background:#14854a}.vC .vletter{background:#e8930c;color:#111}.vD .vletter{background:#c0392b}.vU .vletter{background:#6b7280}.vB .vletter{background:#6b7280}
.pipe-label{font-family:'Saira Extra Condensed',sans-serif;font-weight:900;font-size:30px;letter-spacing:.06em;text-transform:uppercase;margin:34px 0 16px}
.pipe-label span{color:var(--acc)}
.pipe{display:flex;align-items:stretch;margin-bottom:8px}
.pstep{flex:1;border:6px solid var(--ink);background:#fff;padding:18px 16px;min-width:0}
.pstep.alt{background:var(--gray)}
.pstep .pk{font-size:12px;font-weight:700;letter-spacing:.28em;color:var(--acc);margin-bottom:8px}
.pstep .pv{font-family:'Saira Extra Condensed',sans-serif;font-weight:900;font-size:27px;line-height:1.05;text-transform:uppercase;overflow-wrap:break-word}
.pstep .ps{font-size:14px;color:#555;margin-top:8px}
.parr{flex:0 0 46px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:var(--acc)}
.pstep.verd{background:var(--ink);color:#fff}
.pstep.verd .pv{color:#fff}
.tested{background:#fff;border-top:6px solid var(--ink)}
.tested .wrap{padding-top:30px;padding-bottom:44px}
.tested h3{font-family:'Saira Extra Condensed',sans-serif;font-weight:900;font-size:30px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.tested h3 span{color:var(--acc)}
.tlede{font-size:18px;color:var(--ink2);margin-bottom:18px}
.tsteps{display:flex;gap:18px}
.tstep{flex:1;border:6px solid var(--ink);background:#fff;min-width:0}
.tstep .tn{font-family:'Saira Extra Condensed',sans-serif;font-weight:900;font-size:28px;color:var(--acc);letter-spacing:.08em;padding:10px 18px 0}
.tstep .timg{margin:10px 0 0;border-top:4px solid var(--ink);border-bottom:4px solid var(--ink);background:var(--gray)}
.tstep .timg img{display:block;width:100%;height:230px;object-fit:cover}
.tstep p{padding:14px 18px 18px;font-size:16px;color:var(--ink2)}
.tnote{margin-top:14px;font-size:13px;color:#777;letter-spacing:.03em}
.why{background:var(--gray);border-top:6px solid var(--ink);border-bottom:6px solid var(--ink);margin:34px 0 0}
.why .wrap{padding-top:30px;padding-bottom:34px}
.why h3{font-family:'Saira Extra Condensed',sans-serif;font-weight:900;font-size:30px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.why h3 span{color:var(--acc)}
.why ul{list-style:none}
.why li{background:#fff;border:4px solid var(--ink);padding:14px 18px;font-size:18px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start}
.why li .n{font-family:'Saira Extra Condensed',sans-serif;font-weight:900;font-size:24px;color:var(--acc);line-height:1.2;flex:0 0 auto}
footer{background:var(--dark);color:#999;margin-top:44px}
footer .wrap{padding-top:22px;padding-bottom:26px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
footer .proto{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
footer .src{font-size:12px;letter-spacing:.08em}
footer .src b{color:#ccc}
@media(max-width:900px){
  .finder h1{font-size:52px}.addr{font-size:42px}
  .verdict{flex-direction:column}.vletter{flex:none;border-right:0;border-bottom:6px solid var(--ink);font-size:80px;padding:10px}
  .vlot{flex:none;border-left:0;border-top:6px solid var(--ink)}
  .pipe{flex-direction:column}.parr{flex:none;padding:2px 0;transform:rotate(90deg)}
  .tsteps{flex-direction:column}
}
</style>
</head>

</div></section>

<script>
var DATA = JSON.parse(document.getElementById('hah-data').textContent);
var PARCELS = DATA.parcels || [];

var VERDICTS = {
  A: {cls:'vA', title:'Ready for homes', sub:'City rules already allow new homes on this lot.'},
  B: {cls:'vB', title:'Not scored', sub:'This lot was not scored in this round.'},
  C: {cls:'vC', title:'Possible \u2014 needs a rezone', sub:'Homes could work here, but the city would have to rezone the land first.'},
  D: {cls:'vD', title:'Not a fit', sub:'This lot does not work for new homes under current city rules.'},
  UNKNOWN: {cls:'vU', title:"Can't tell yet", sub:'We are missing something needed to score this lot. A missing answer is never a yes.'}
};
function vkey(p){ var c=String(p.category||'').toUpperCase(); return VERDICTS[c]?c:'UNKNOWN'; }

var ZONES = {
  'CC':'Commercial corridor','CSHBD1':'Sugar House business district','D-1':'Downtown core',
  'D-2':'Downtown support','D-4':'Downtown / arena district','FB-SE':'Form-based district',
  'FB-UN2':'Form-based neighborhood','GMU':'Gateway mixed-use','PL':'Public land',
  'R-1-5000':'Single-family residential','R-MU':'Residential mixed-use','R-MU-35':'Residential mixed-use',
  'SR-1A':'Single-family residential','TSA-UN-T':'Transit corridor'
};
function zoneLabel(z){ z=String(z||'').toUpperCase(); if(z==='UNKNOWN'||!z) return 'Not listed'; return ZONES[z]||z; }

var FITMAP = [
  [/townhome/i,'Townhomes'],[/multifamily/i,'Apartments'],[/single-family/i,'Single-family homes'],
  [/twin|two-family/i,'Duplexes'],[/accessory|\(ADU\)/i,'Backyard cottages'],[/loft|studio/i,'Live-work lofts'],
  [/assisted living/i,'Assisted living'],[/congregate/i,'Congregate care'],[/group home/i,'Group homes']
];
function fitsShort(ft){
  if(!ft) return [];
  var out=[];
  FITMAP.forEach(function(m){ if(m[0].test(ft) && out.indexOf(m[1])<0) out.push(m[1]); });
  return out.slice(0,3);
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function acres(p){ var a=parseFloat(p.acres); return isNaN(a)?'Not listed':(a.toFixed(2).replace(/\.00$/,''))+' acres'; }
function addrHtml(p){
  if(p.site_address) return esc(p.site_address);
  return '<span style="color:#777">No street address on file</span>';
}
function cityLine(p){
  var c=[p.site_city,p.site_zip].filter(Boolean).join(' ');
  return c||'Salt Lake County';
}

function whyBullets(p, vk, fits){
  var z=zoneLabel(p.zone_code), a=acres(p), out=[];
  if(vk==='A'){
    out.push('The city\u2019s rulebook already allows homes on this lot.');
    if(fits.length) out.push('Best fit: '+fits.join(', ').toLowerCase()+'.');
    out.push('Lot size: '+a+'.');
  }else if(vk==='C'){
    out.push('Right now this land is reserved for public use \u2014 homes aren\u2019t allowed as-is.');
    var r=String(p.binding_rules||'').toLowerCase();
    if(r.indexOf('other side village')>=0) out.push('The city is studying a rezone (Other Side Village) that could change that.');
    else out.push('A city rezone could change that.');
  }else if(vk==='D'){
    out.push('Homes aren\u2019t allowed here under current city rules.');
    out.push('Zoned: '+z+'.');
  }else if(vk==='B'){
    out.push('This lot was not scored in this round.');
  }else{
    var rs=String(p.reason||'').toLowerCase();
    if(rs.indexOf('layout')>=0 && rs.indexOf('yield')>=0)
      out.push('We couldn\u2019t confirm a workable building layout for this lot yet.');
    else if(p.reason) out.push(esc(String(p.reason).split('.')[0])+'.');
    else out.push('This lot wasn\u2019t part of the scored set.');
    out.push('A missing answer is never a yes \u2014 it stays undecided.');
  }
  return out.slice(0,3);
}

function lotSVG(p, vk){
  var col = vk==='A' ? '#14854a' : vk==='C' ? '#e8930c' : vk==='D' ? '#c0392b' : '#6b7280';
  return '<svg viewBox="0 0 260 190" width="210" role="img" aria-label="Lot diagram">'
    +'<polygon points="40,30 220,30 190,160 10,160" fill="#fff" stroke="#111" stroke-width="6"/>'
    +'<polygon points="58,48 202,48 178,142 34,142" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="7 6"/>'
    +'<rect x="95" y="75" width="70" height="48" fill="'+col+'" stroke="#111" stroke-width="5"/>'
    +'<text x="130" y="148" text-anchor="middle" font-family="Saira, sans-serif" font-size="13" font-weight="700" fill="#111">'+esc(acres(p)).toUpperCase()+'</text>'
    +'<circle cx="222" cy="52" r="16" fill="#fff" stroke="#111" stroke-width="4"/>'
    +'<text x="222" y="59" text-anchor="middle" font-family="Saira, sans-serif" font-size="16" font-weight="700" fill="#111">N</text>'
    +'<text x="222" y="34" text-anchor="middle" font-family="Saira, sans-serif" font-size="15" font-weight="700" fill="#111">\u25B2</text>'
    +'</svg>';
}

function defaultParcel(){
  return PARCELS.find(function(p){return vkey(p)==='A'&&p.site_address;})
      || PARCELS.find(function(p){return p.site_address;})
      || PARCELS[0];
}
var q=document.getElementById('q'), sugg=document.getElementById('sugg');
function matches(query){
  query=String(query||'').trim().toLowerCase();
  if(query.length<2) return [];
  var digits=query.replace(/\D/g,'');
  return PARCELS.filter(function(p){
    if(p.site_address&&p.site_address.toLowerCase().indexOf(query)>=0) return true;
    if(digits.length>=4&&p.parcel_id.indexOf(digits)===0) return true;
    return false;
  }).slice(0,8);
}
function showSugg(list){
  if(!list.length){sugg.style.display='none';return;}
  sugg.innerHTML=list.map(function(p){
    var label=p.site_address?esc(p.site_address):'<span class="noaddr">No street address on file</span>';
    var loc=[p.site_city,p.site_zip].filter(Boolean).join(' ');
    return '<button data-pid="'+esc(p.parcel_id)+'">'+label
      +'<span class="pid">'+esc(loc)+' \u00B7 Parcel '+esc(p.parcel_id)+'</span></button>';
  }).join('');
  sugg.style.display='block';
  Array.prototype.forEach.call(sugg.querySelectorAll('button'),function(b){
    b.addEventListener('click',function(){ pick(b.getAttribute('data-pid')); });
  });
}
function pick(pid){
  sugg.style.display='none'; q.value='';
  if(location.hash==='#parcel='+pid) render(pid); else location.hash='parcel='+pid;
}
q.addEventListener('input',function(){showSugg(matches(q.value));});
q.addEventListener('keydown',function(e){
  if(e.key==='Enter'){var m=matches(q.value); if(m.length) pick(m[0].parcel_id);}
  if(e.key==='Escape'){sugg.style.display='none';}
});
document.addEventListener('click',function(e){ if(!e.target.closest('.searchbox')) sugg.style.display='none'; });
window.addEventListener('hashchange',function(){
  var m=location.hash.match(/parcel=(\d+)/); render(m?m[1]:null);
});
(function(){
  var line=document.getElementById('tryline');
  ['A','C','D'].forEach(function(k){
    var p=PARCELS.find(function(x){return vkey(x)===k&&x.site_address;});
    if(!p) return;
    var b=document.createElement('button');
    b.textContent=p.site_address;
    b.addEventListener('click',function(){pick(p.parcel_id);});
    line.appendChild(b);
  });
})();
(function(){
  var m=location.hash.match(/parcel=(\d+)/);
  render(m?m[1]:null);
})();
